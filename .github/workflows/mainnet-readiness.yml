name: Mainnet readiness

# This is the manifest gate for mainnet. It is intentionally NOT part of the
# pull-request CI: mainnet stays red until the verified addresses, Safe, budget,
# reserve, timelock, guardian, startBlock, and verification flag are filled in.
#
# Run it manually before a mainnet deployment, or let the release tag trigger
# it. The `mainnet` GitHub Environment must require reviewer approval.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mainnet-readiness
  cancel-in-progress: false

jobs:
  manifest:
    name: Verify mainnet manifest
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Gate: mainnet manifest must be ready"
        run: bun run verify:manifest:mainnet

      - name: Record next steps
        run: |
          {
            echo "### Mainnet manifest is ready"
            echo ""
            echo "Continue with the deployment runbook:"
            echo "1. \`contracts/script/DeployProtocol.s.sol\`"
            echo "2. \`contracts/script/DeployTreasury.s.sol\`"
            echo "3. \`contracts/script/DeployStockOracle.s.sol\` per ticker"
            echo "4. \`contracts/script/DeployStockVault.s.sol\` per ticker"
            echo "5. \`contracts/script/ConfigureProtocol.s.sol\`, \`ConfigureTreasury.s.sol\`, and \`ConfigureStockVault.s.sol\`"
            echo "6. \`contracts/script/TransferOwnership.s.sol\` then timelock \`acceptOwnership()\`"
            echo "7. \`contracts/script/VerifyMainnet.s.sol\`"
            echo "8. Indexer backfill from \`startBlock\`, then smoke test"
          } >> "$GITHUB_STEP_SUMMARY"
