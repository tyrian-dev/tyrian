[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../node_modules", "node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

# Deploy guards read the network manifest from the repo-level config folder.
fs_permissions = [{ access = "read", path = "../config" }]

remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=../node_modules/forge-std/src/"
]

[invariant]
runs = 64
depth = 100
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.chain.robinhood.com"
